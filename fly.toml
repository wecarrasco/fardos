# Fly.io config. Set app name and region, then:
#   fly launch --no-deploy --copy-config
#   fly volumes create mtg_data --size 1
#   fly secrets set REFRESH_TOKEN="$(openssl rand -hex 24)"
#   fly deploy
app = "mtg-card-search"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LINKTREE_USERNAME = "ChelitoSAF"
  DB_PATH = "/data/mtg.db"
  PORT = "3000"

# Keeps the SQLite file across deploys and restarts.
[mounts]
  source = "mtg_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # An update takes ~2 minutes and runs in this process, so do not let the
  # machine stop while one is in flight.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
